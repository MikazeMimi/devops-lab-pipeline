services:
  web-api:
    image: mikazemimi/devops-lab-api:latest
    container_name: devops-lab-web
    ports:
      - "8080:5000"
    environment:
      - APP_ENV=production
      - REDIS_HOST=redis-cache
    depends_on:
      - redis-cache
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    container_name: devops-lab-redis
    restart: unless-stopped
